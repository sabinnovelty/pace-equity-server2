x-defaults: &apiServiceDefaults
  init: true
  tty: true
  command: npm run local
  env_file:
    - .env.local
  networks:
    - gold-v2-local

networks:
  gold-v2-local:

services:
  redis:
    container_name: gold-v2-redis
    image: redis:latest
    ports:
      - 6379:6379
    networks:
      - gold-v2-server
    restart: on-failure
    env_file:
      - .env
    volumes:
      - ./redis-data:/data
    command: sh -c "redis-server --requirepass $REDIS_PASSWORD"
  mongodb:
    image: mongo:latest
    container_name: gold-v2-mongodb-local
    restart: always
    extra_hosts:
      - 'localhost:0.0.0.0'
    ports:
      - ${MONGO_DB_PORT}:${MONGO_DB_PORT}
    networks:
      - gold-v2-local
    env_file:
      - .env.local
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_DB_NAME}
      - MONGO_INITDB_USER=${MONGO_USERNAME}
      - MONGO_INITDB_PWD=${MONGO_PASSWORD}
    volumes:
      - ./mongodb-data:/data/db
      - ./mongodb_replica/initiate.sh:/script/initiate.sh
    command: sh /script/initiate.sh -u $MONGO_USERNAME -p $MONGO_PASSWORD

  api-server:
    <<: *apiServiceDefaults
    container_name: gold-v2-user-auth-local
    ports:
      - '3000:3000'
      - '9000:9000'
    build:
      args:
        APP: user-auth
        START_COMMAND: local
      context: .
      dockerfile: ./Dockerfile.development
    volumes:
      - ./:/app/
      - /node_modules
